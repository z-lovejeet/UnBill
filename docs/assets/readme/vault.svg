<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="410" viewBox="0 0 1280 410" role="img" aria-labelledby="title desc">
  <title id="title">Encrypted history, owned by this browser profile.</title>
  <desc id="desc">AES-256-GCM ciphertext is stored in localStorage. A nonextractable CryptoKey is stored separately in IndexedDB. Up to thirty reports can be reopened. This is not password protection or account recovery.</desc>
  <rect x="0" y="0" width="1280" height="410" rx="24" fill="#F7FAF7" stroke="none" />
  <text x="46" y="42" fill="#116149" font-size="11" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="2">UNBILL  /  PRODUCT &amp; ENGINEERING GUIDE</text>
  <text x="46" y="87" fill="#142821" font-size="30" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="0">Encrypted history, owned by this browser profile.</text>
  <text x="46" y="388" fill="#56665F" font-size="12" font-family="Arial, Helvetica, sans-serif" font-weight="400" letter-spacing="0">UnBill  •  Read the charge. Understand the concern. Prepare the next step.</text>
  <rect x="46" y="126" width="350" height="193" rx="16" fill="#FFFFFF" stroke="#DCE5DE" />
  <text x="68" y="158" fill="#116149" font-size="11" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="1.5">BROWSER STATE</text>
  <text x="68" y="192" fill="#142821" font-size="22" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="0">Reports + share controls</text>
  <text x="68" y="226" fill="#56665F" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="400" letter-spacing="0">Up to 30 recent reviews.</text>
  <text x="68" y="253" fill="#56665F" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="400" letter-spacing="0">Selections remain connected.</text>
  <text x="68" y="280" fill="#56665F" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="400" letter-spacing="0">No server account to restore them.</text>
  <path d="M396 220 L443 220" fill="none" stroke="#116149" stroke-width="2" />
  <polygon points="443,220 435,215 435,225" fill="#116149" />
  <rect x="445" y="126" width="350" height="193" rx="16" fill="#DDF3E8" stroke="#DCE5DE" />
  <text x="467" y="158" fill="#116149" font-size="11" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="1.5">WEB CRYPTO</text>
  <text x="467" y="192" fill="#142821" font-size="22" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="0">AES-256-GCM</text>
  <text x="467" y="226" fill="#56665F" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="400" letter-spacing="0">Random IV for each encryption.</text>
  <text x="467" y="253" fill="#56665F" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="400" letter-spacing="0">Authenticated ciphertext at rest.</text>
  <text x="467" y="280" fill="#56665F" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="400" letter-spacing="0">Device key in IndexedDB.</text>
  <path d="M795 220 L842 220" fill="none" stroke="#116149" stroke-width="2" />
  <polygon points="842,220 834,215 834,225" fill="#116149" />
  <rect x="844" y="126" width="390" height="193" rx="16" fill="#E9F3FC" stroke="#DCE5DE" />
  <text x="866" y="158" fill="#116149" font-size="11" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="1.5">LOCAL PERSISTENCE</text>
  <text x="866" y="192" fill="#142821" font-size="22" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="0">Encrypted localStorage</text>
  <text x="866" y="226" fill="#56665F" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="400" letter-spacing="0">Reopen on the same browser profile.</text>
  <text x="866" y="253" fill="#56665F" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="400" letter-spacing="0">Delete local reports independently.</text>
  <text x="866" y="280" fill="#56665F" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="400" letter-spacing="0">Clearing site data can lose access.</text>
  <text x="46" y="358" fill="#56665F" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="400" letter-spacing="0">The device key is not a password boundary. Same-origin scripts can access an opened report.</text>
</svg>