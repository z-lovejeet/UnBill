<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="430" viewBox="0 0 1280 430" role="img" aria-labelledby="title desc">
  <title id="title">Four data boundaries, each with a clear purpose.</title>
  <desc id="desc">Browser: encrypted reports and private share controls. Gemini: consented document or text input. Groq: consented questions and minimized report context. Redis: explicitly shared redacted reports and request counters.</desc>
  <rect x="0" y="0" width="1280" height="430" rx="24" fill="#F7FAF7" stroke="none" />
  <text x="46" y="42" fill="#116149" font-size="11" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="2">UNBILL  /  PRODUCT &amp; ENGINEERING GUIDE</text>
  <text x="46" y="87" fill="#142821" font-size="30" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="0">Four data boundaries, each with a clear purpose.</text>
  <text x="46" y="408" fill="#56665F" font-size="12" font-family="Arial, Helvetica, sans-serif" font-weight="400" letter-spacing="0">UnBill  •  Read the charge. Understand the concern. Prepare the next step.</text>
  <rect x="46" y="125" width="278" height="234" rx="16" fill="#DDF3E8" stroke="#DCE5DE" />
  <text x="68" y="157" fill="#116149" font-size="11" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="1.5">DEVICE</text>
  <text x="68" y="191" fill="#142821" font-size="22" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="0">Local vault</text>
  <text x="68" y="225" fill="#56665F" font-size="15" font-family="Arial, Helvetica, sans-serif" font-weight="400" letter-spacing="0">Encrypted report history.</text>
  <text x="68" y="252" fill="#56665F" font-size="15" font-family="Arial, Helvetica, sans-serif" font-weight="400" letter-spacing="0">Private share controls.</text>
  <text x="68" y="279" fill="#56665F" font-size="15" font-family="Arial, Helvetica, sans-serif" font-weight="400" letter-spacing="0">No account-based sync.</text>
  <rect x="346" y="125" width="278" height="234" rx="16" fill="#E9F3FC" stroke="#DCE5DE" />
  <text x="368" y="157" fill="#116149" font-size="11" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="1.5">CONSENT TO EXTRACT</text>
  <text x="368" y="191" fill="#142821" font-size="22" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="0">Gemini</text>
  <text x="368" y="225" fill="#56665F" font-size="15" font-family="Arial, Helvetica, sans-serif" font-weight="400" letter-spacing="0">Uploaded file or pasted text.</text>
  <text x="368" y="252" fill="#56665F" font-size="15" font-family="Arial, Helvetica, sans-serif" font-weight="400" letter-spacing="0">Structured extraction.</text>
  <text x="368" y="279" fill="#56665F" font-size="15" font-family="Arial, Helvetica, sans-serif" font-weight="400" letter-spacing="0">Provider terms apply.</text>
  <rect x="646" y="125" width="278" height="234" rx="16" fill="#FFFFFF" stroke="#DCE5DE" />
  <text x="668" y="157" fill="#116149" font-size="11" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="1.5">CONSENT TO CHAT</text>
  <text x="668" y="191" fill="#142821" font-size="22" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="0">Groq</text>
  <text x="668" y="225" fill="#56665F" font-size="15" font-family="Arial, Helvetica, sans-serif" font-weight="400" letter-spacing="0">Questions + minimized context.</text>
  <text x="668" y="252" fill="#56665F" font-size="15" font-family="Arial, Helvetica, sans-serif" font-weight="400" letter-spacing="0">Typed text is still transmitted.</text>
  <text x="668" y="279" fill="#56665F" font-size="15" font-family="Arial, Helvetica, sans-serif" font-weight="400" letter-spacing="0">No names in generated context.</text>
  <rect x="946" y="125" width="278" height="234" rx="16" fill="#FFF3D8" stroke="#DCE5DE" />
  <text x="968" y="157" fill="#116149" font-size="11" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="1.5">CONSENT TO SHARE</text>
  <text x="968" y="191" fill="#142821" font-size="22" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="0">Redis share copy</text>
  <text x="968" y="225" fill="#56665F" font-size="15" font-family="Arial, Helvetica, sans-serif" font-weight="400" letter-spacing="0">Direct identifiers removed.</text>
  <text x="968" y="252" fill="#56665F" font-size="15" font-family="Arial, Helvetica, sans-serif" font-weight="400" letter-spacing="0">Procedures + amounts remain.</text>
  <text x="968" y="279" fill="#56665F" font-size="15" font-family="Arial, Helvetica, sans-serif" font-weight="400" letter-spacing="0">Link holders can read it.</text>
</svg>