  <text x="68" y="557" fill="#116149" font-size="11" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="1.5">GOOGLE GEMINI</text>
  <text x="68" y="591" fill="#142821" font-size="22" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="0">Document extraction</text>
  <text x="68" y="625" fill="#56665F" font-size="15" font-family="Arial, Helvetica, sans-serif" font-weight="400" letter-spacing="0">Structured statement fields</text>
  <rect x="448" y="525" width="384" height="119" rx="16" fill="#E9F3FC" stroke="#DCE5DE" />
  <text x="470" y="557" fill="#116149" font-size="11" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="1.5">GROQ</text>
  <text x="470" y="591" fill="#142821" font-size="22" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="0">Conversational assistance</text>
  <text x="470" y="625" fill="#56665F" font-size="15" font-family="Arial, Helvetica, sans-serif" font-weight="400" letter-spacing="0">Text streaming; no bill modification</text>
  <rect x="850" y="525" width="384" height="119" rx="16" fill="#FFF3D8" stroke="#DCE5DE" />
  <text x="872" y="557" fill="#116149" font-size="11" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="1.5">UPSTASH REDIS</text>
  <text x="872" y="591" fill="#142821" font-size="22" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="0">Shared state</text>
  <text x="872" y="625" fill="#56665F" font-size="15" font-family="Arial, Helvetica, sans-serif" font-weight="400" letter-spacing="0">Redacted copies + request counters</text>
