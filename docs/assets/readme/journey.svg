<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img" aria-labelledby="title desc">
  <title id="title">One connected journey, from statement to follow-up.</title>
  <desc id="desc">Four stages: bring an itemized statement, understand the findings, prepare the request, and manage saved reports and shared access.</desc>
  <rect x="0" y="0" width="1280" height="380" rx="24" fill="#F7FAF7" stroke="none" />
  <text x="46" y="42" fill="#116149" font-size="11" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="2">UNBILL  /  PRODUCT &amp; ENGINEERING GUIDE</text>
  <text x="46" y="87" fill="#142821" font-size="30" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="0">One connected journey, from statement to follow-up.</text>
  <text x="46" y="358" fill="#56665F" font-size="12" font-family="Arial, Helvetica, sans-serif" font-weight="400" letter-spacing="0">UnBill  •  Read the charge. Understand the concern. Prepare the next step.</text>
  <rect x="46" y="125" width="278" height="195" rx="16" fill="#FFFFFF" stroke="#DCE5DE" />
  <text x="68" y="157" fill="#116149" font-size="11" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="1.5">01 / INTAKE</text>
  <text x="68" y="191" fill="#142821" font-size="22" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="0">Bring the details</text>
  <text x="68" y="225" fill="#56665F" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="400" letter-spacing="0">Upload a file or paste text.</text>
  <text x="68" y="252" fill="#56665F" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="400" letter-spacing="0">Consent before extraction.</text>
  <path d="M326 221 L343 221" fill="none" stroke="#116149" stroke-width="2" />
  <polygon points="343,221 335,216 335,226" fill="#116149" />
  <rect x="346" y="125" width="278" height="195" rx="16" fill="#DDF3E8" stroke="#DCE5DE" />
  <text x="368" y="157" fill="#116149" font-size="11" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="1.5">02 / REVIEW</text>
  <text x="368" y="191" fill="#142821" font-size="22" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="0">Understand each charge</text>
  <text x="368" y="225" fill="#56665F" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="400" letter-spacing="0">See the concern and reason.</text>
  <text x="368" y="252" fill="#56665F" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="400" letter-spacing="0">Choose what to question.</text>
  <path d="M626 221 L643 221" fill="none" stroke="#116149" stroke-width="2" />
  <polygon points="643,221 635,216 635,226" fill="#116149" />
  <rect x="646" y="125" width="278" height="195" rx="16" fill="#E9F3FC" stroke="#DCE5DE" />
  <text x="668" y="157" fill="#116149" font-size="11" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="1.5">03 / PREPARE</text>
  <text x="668" y="191" fill="#142821" font-size="22" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="0">Start the conversation</text>
  <text x="668" y="225" fill="#56665F" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="400" letter-spacing="0">Copy a letter. Read a script.</text>
  <text x="668" y="252" fill="#56665F" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="400" letter-spacing="0">Ask the optional coach.</text>
  <path d="M926 221 L943 221" fill="none" stroke="#116149" stroke-width="2" />
  <polygon points="943,221 935,216 935,226" fill="#116149" />
  <rect x="946" y="125" width="278" height="195" rx="16" fill="#FFF3D8" stroke="#DCE5DE" />
  <text x="968" y="157" fill="#116149" font-size="11" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="1.5">04 / CONTROL</text>
  <text x="968" y="191" fill="#142821" font-size="22" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="0">Return or share</text>
  <text x="968" y="225" fill="#56665F" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="400" letter-spacing="0">Reopen encrypted history.</text>
  <text x="968" y="252" fill="#56665F" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="400" letter-spacing="0">Revoke a redacted link.</text>
</svg>